<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas Cloud Services</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           PAGE
        ========================= */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            /* BACKGROUND IMAGE */
            background-image: url("./datacentre.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }


        /* =========================
           CONTENEUR PRINCIPAL
        ========================= */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =========================
           CARTE LOGIN
        ========================= */

        .login-box {
            width: 398px;
            max-width: 100%;

            background: rgba(255, 255, 255, 0.98);

            border-radius: 8px;

            padding: 28px 22px 30px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.18);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            height: 175px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #dedede;

            margin-bottom: 35px;
        }

        .logo-title {
            text-align: left;

            color: #3446a5;

            font-size: 31px;

            font-weight: 700;

            line-height: 0.92;

            letter-spacing: -1.2px;
        }

        .logo-title span {
            display: block;
        }

        .logo-cloud,
        .logo-services {
            font-size: 27px;
        }


        /* =========================
           FORMULAIRE
        ========================= */

        .form-group {
            margin-bottom: 23px;
        }


        /* =========================
           LABEL
        ========================= */

        .field-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 13px;
        }

        .field-header label {
            color: #171717;

            font-size: 20px;

            font-weight: 400;
        }

        .choose-user {
            color: #6515d5;

            font-size: 16px;

            text-decoration: none;

            cursor: pointer;
        }

        .choose-user:hover {
            text-decoration: underline;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 16px;

            border: 1px solid #d9d9d9;

            border-radius: 8px;

            background: #ffffff;

            color: #333333;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        .form-group input:focus {
            border-color: #a066ed;

            box-shadow:
                0 0 0 2px rgba(160, 102, 237, 0.12);
        }


        /* =========================
           BOUTON LOGIN
        ========================= */

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 18px;

            border: none;

            border-radius: 8px;

            background: #a064ed;

            color: #ffffff;

            font-size: 19px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .login-button:hover {
            background: #9253df;
        }

        .login-button:active {
            transform: scale(0.99);
        }


        /* =========================
           OR
        ========================= */

        .separator {
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #777777;

            font-size: 16px;
        }


        /* =========================
           MICROSOFT AZURE
        ========================= */

        .azure-button {
            width: 100%;

            height: 55px;

            border: 1px solid #d9d9d9;

            border-radius: 8px;

            background: #ffffff;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            color: #202020;

            font-size: 18px;

            cursor: pointer;

            transition:
                background 0.2s ease;
        }

        .azure-button:hover {
            background: #fafafa;
        }

        .azure-icon {
            color: #a064ed;

            font-size: 21px;

            font-weight: bold;
        }


        /* =========================
           MESSAGE DE SIMULATION
        ========================= */

        .training {
            margin-top: 22px;

            text-align: center;

            font-size: 11px;

            line-height: 1.4;

            color: #777777;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .page {
                padding: 10px;
            }

            .login-box {
                width: 100%;

                padding: 25px 20px;
            }

            .logo {
                height: 150px;

                margin-bottom: 30px;
            }

            .logo-title {
                font-size: 28px;
            }

            .logo-cloud,
            .logo-services {
                font-size: 25px;
            }

            .field-header label {
                font-size: 18px;
            }

            .choose-user {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         PAGE
    ========================= -->

    <div class="page">

        <!-- =========================
             CARTE LOGIN
        ========================= -->

        <div class="login-box">


            <!-- =========================
                 LOGO
            ========================= -->

            <div class="logo">

                <div class="logo-title">

                    <span>Atlas</span>

                    <span class="logo-cloud">
                        Cloud
                    </span>

                    <span class="logo-services">
                        Services
                    </span>

                </div>

            </div>


            <!-- =========================
                 FORMULAIRE
            ========================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <div class="field-header">

                        <label for="email">
                            Email
                        </label>

                        <a
                            href="#"
                            class="choose-user"
                            onclick="return false;"
                        >
                            Choose a user
                        </a>

                    </div>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="field-header">

                        <label for="password">
                            Password
                        </label>

                    </div>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Log in
                </button>

            </form>


            <!-- =========================
                 SEPARATEUR
            ========================= -->

            <div class="separator">
                - or -
            </div>


            <!-- =========================
                 AZURE
            ========================= -->

            <button
                type="button"
                class="azure-button"
                id="azureButton"
            >

                <span class="azure-icon">
                    ↪
                </span>

                <span>
                    Microsoft Azure
                </span>

            </button>


            <!-- =========================
                 MESSAGE
            ========================= -->

            <div class="training">

                Simulation de sensibilisation —
                aucune donnée de connexion
                n'est transmise ou enregistrée.

            </div>


        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /*
         * Simulation uniquement.
         * Aucune donnée saisie n'est envoyée
         * à un serveur.
         */

        const loginForm =
            document.getElementById("loginForm");

        const azureButton =
            document.getElementById("azureButton");


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                window.location.href =
                    "sensibilisation.html";

            }
        );


        /* =========================
           AZURE
        ========================= */

        azureButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "sensibilisation.html";

            }
        );

    </script>

</body>

</html>
