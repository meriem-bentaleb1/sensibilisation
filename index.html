<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas Cloud Services</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;

    background-image: url("./datacentre.jpg");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    min-height: 100vh;
}


/* =========================
   PAGE
========================= */

.page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =========================
   CARTE
========================= */

.login-box {
    width: 398px;
    min-height: 755px;

    background: rgba(255, 255, 255, 0.98);

    border-radius: 8px;

    padding: 28px 22px;

    box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.15);
}


/* =========================
   LOGO
========================= */

.logo {
    height: 175px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-bottom: 1px solid #dedede;

    margin-bottom: 68px;
}


/*
   Logo texte.
   Si tu possèdes le fichier du vrai logo,
   remplace cette partie par une <img>.
*/

.logo-text {
    text-align: left;

    color: #3446a5;

    font-weight: 700;

    line-height: 0.92;

    font-size: 31px;

    letter-spacing: -1.2px;
}

.logo-text .atlas {
    display: block;
}

.logo-text .cloud {
    display: block;
}

.logo-text .services {
    display: block;
}


/* =========================
   CHAMPS
========================= */

.form-group {
    margin-bottom: 23px;
}

.field-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 13px;
}

.field-header label {
    font-size: 20px;

    color: #171717;

    font-weight: 400;
}

.choose-user {
    color: #6515d5;

    font-size: 16px;

    text-decoration: none;

    cursor: pointer;
}

.choose-user:hover {
    text-decoration: underline;
}


.form-group input {
    width: 100%;

    height: 50px;

    border: 1px solid #d9d9d9;

    border-radius: 8px;

    padding: 0 16px;

    background: #ffffff;

    color: #333;

    font-size: 18px;

    outline: none;
}

.form-group input::placeholder {
    color: #999;
}

.form-group input:focus {
    border-color: #a066ed;

    box-shadow:
        0 0 0 2px rgba(160, 102, 237, 0.12);
}


/* =========================
   BOUTON LOG IN
========================= */

.login-button {
    width: 100%;

    height: 50px;

    margin-top: 18px;

    border: none;

    border-radius: 8px;

    background: #a064ed;

    color: #ffffff;

    font-size: 19px;

    font-weight: 500;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}

.login-button:hover {
    background: #9253df;
}

.login-button:active {
    transform: scale(0.99);
}


/* =========================
   OR
========================= */

.separator {
    height: 44px;

    display: flex;

    justify-content: center;
    align-items: center;

    color: #777;

    font-size: 16px;
}


/* =========================
   AZURE
========================= */

.azure-button {
    width: 100%;

    height: 55px;

    border: 1px solid #d9d9d9;

    border-radius: 8px;

    background: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    color: #202020;

    font-size: 18px;

    cursor: pointer;
}

.azure-button:hover {
    background: #fafafa;
}

.azure-icon {
    color: #a064ed;

    font-size: 21px;

    font-weight: bold;
}


/* =========================
   MESSAGE DE SIMULATION
========================= */

.training {
    margin-top: 25px;

    text-align: center;

    font-size: 11px;

    color: #777;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .page {
        padding: 10px;
    }

    .login-box {
        width: 100%;

        min-height: auto;

        padding: 25px 20px;
    }

    .logo {
        margin-bottom: 45px;
    }

}

</style>
</head>


<body>

<div class="page">

    <div class="login-box">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-text">

                <span class="atlas">
                    Atlas
                </span>

                <span class="cloud">
                    Cloud
                </span>

                <span class="services">
                    Services
                </span>

            </div>

        </div>


        <!-- FORMULAIRE -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <div class="field-header">

                    <label for="email">
                        Email
                    </label>

                    <a
                        href="#"
                        class="choose-user"
                        onclick="return false;"
                    >
                        Choose a user
                    </a>

                </div>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <div class="field-header">

                    <label for="password">
                        Password
                    </label>

                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button"
            >
                Log in
            </button>

        </form>


        <!-- SEPARATEUR -->

        <div class="separator">
            - or -
        </div>


        <!-- AZURE VISUEL -->

        <button
            type="button"
            class="azure-button"
            id="azureButton"
        >

            <span class="azure-icon">
                ↪
            </span>

            <span>
                Microsoft Azure
            </span>

        </button>


        <!-- SIMULATION -->

        <div class="training">
            Simulation de sensibilisation — aucune donnée
            de connexion n'est transmise ou enregistrée.
        </div>


    </div>

</div>


<script>

/*
 * Simulation uniquement.
 * Les informations saisies ne sont jamais envoyées
 * à un serveur.
 */

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        window.location.href = "sensibilisation.html";

    });


document
    .getElementById("azureButton")
    .addEventListener("click", function() {

        window.location.href = "sensibilisation.html";

    });

</script>

</body>
</html>
