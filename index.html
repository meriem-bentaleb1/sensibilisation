<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas Cloud Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.08),
                    rgba(0, 0, 0, 0.08)
                ),
                url("./datacentre.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Centrage de la fenêtre */
        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        /* Carte principale */
        .login-box {
            width: 100%;
            max-width: 400px;

            background: rgba(255, 255, 255, 0.98);

            border-radius: 8px;

            padding: 28px 22px 30px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.18);
        }

        /* Logo */
        .logo {
            text-align: center;

            padding-bottom: 20px;
            margin-bottom: 22px;

            border-bottom: 1px solid #dedede;
        }

        .logo-title {
            display: inline-block;

            color: #3445a5;

            font-size: 30px;
            font-weight: 700;

            line-height: 0.95;

            text-align: left;
        }

        .logo-title span {
            display: block;
        }

        .logo-cloud {
            font-size: 27px;
        }

        .logo-services {
            font-size: 27px;
        }

        /* Ligne Email */
        .field-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        .field-header label {
            color: #222;

            font-size: 16px;
            font-weight: 400;
        }

        .choose-user {
            color: #5d19d6;

            font-size: 14px;

            text-decoration: none;

            cursor: pointer;
        }

        .choose-user:hover {
            text-decoration: underline;
        }

        /* Champs */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border: 1px solid #d9d9d9;
            border-radius: 8px;

            background: #fff;

            color: #333;

            font-size: 16px;

            outline: none;

            transition: border-color 0.2s,
                        box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input:focus {
            border-color: #9b63ee;

            box-shadow:
                0 0 0 2px rgba(155, 99, 238, 0.12);
        }

        /* Bouton Login */
        .login-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 8px;

            background: #a366ed;

            color: white;

            font-size: 18px;
            font-weight: 500;

            cursor: pointer;

            transition: background 0.2s;
        }

        .login-button:hover {
            background: #9255df;
        }

        /* Séparateur */
        .separator {
            display: flex;
            align-items: center;
            justify-content: center;

            margin: 17px 0;

            color: #777;

            font-size: 15px;
        }

        /* Bouton Azure - purement visuel dans la simulation */
        .azure-button {
            width: 100%;
            height: 56px;

            border: 1px solid #dedede;
            border-radius: 8px;

            background: #fff;

            color: #222;

            font-size: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            cursor: pointer;
        }

        .azure-button:hover {
            background: #fafafa;
        }

        .azure-icon {
            width: 18px;
            height: 18px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: #8d52e8;

            font-size: 20px;
            font-weight: bold;
        }

        /* Message de simulation */
        .training-message {
            margin-top: 22px;

            padding: 10px;

            border-radius: 6px;

            background: #f5f5f5;

            color: #777;

            text-align: center;

            font-size: 11px;
            line-height: 1.4;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .login-box {
                max-width: 100%;

                padding: 25px 20px;
            }

            .logo-title {
                font-size: 26px;
            }

            .logo-cloud,
            .logo-services {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-title">
                <span>Atlas</span>
                <span class="logo-cloud">Cloud</span>
                <span class="logo-services">Services</span>
            </div>
        </div>


        <!-- Formulaire -->
        <form id="loginForm">

            <!-- Email -->
            <div class="form-group">

                <div class="field-header">

                    <label for="email">
                        Email
                    </label>

                    <a
                        href="#"
                        class="choose-user"
                        onclick="return false;"
                    >
                        Choose a user
                    </a>

                </div>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <div class="field-header">

                    <label for="password">
                        Password
                    </label>

                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- Login -->
            <button
                type="submit"
                class="login-button"
            >
                Log in
            </button>

        </form>


        <!-- Séparateur -->
        <div class="separator">
            - or -
        </div>


        <!-- Microsoft Azure -->
        <button
            type="button"
            class="azure-button"
            id="azureButton"
        >
            <span class="azure-icon">↪</span>
            <span>Microsoft Azure</span>
        </button>


        <!-- Sensibilisation -->
        <div class="training-message">
            Simulation de sensibilisation — aucune donnée de connexion
            n'est transmise ou enregistrée.
        </div>

    </div>

</div>


<script>
    /*
     * Simulation uniquement.
     * Aucune donnée saisie n'est envoyée à un serveur.
     */

    const loginForm = document.getElementById("loginForm");
    const azureButton = document.getElementById("azureButton");

    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        /*
         * Redirection vers la page pédagogique.
         */
        window.location.href = "sensibilisation.html";
    });


    azureButton.addEventListener("click", function() {

        /*
         * Le bouton Azure est uniquement décoratif
         * dans cette simulation.
         */
        window.location.href = "sensibilisation.html";
    });
</script>

</body>
</html>
