<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas Cloud Services</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background-image: url("./datacentre.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }


        /* =====================================
           PAGE
        ===================================== */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px;
        }


        /* =====================================
           CARTE BLANCHE
        ===================================== */

        .login-box {
            width: 400px;

            background: rgba(255, 255, 255, 0.98);

            border-radius: 8px;

            padding: 18px 20px 20px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.16);
        }


        /* =====================================
           LOGO ACS
        ===================================== */

        .logo {
            height: 180px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #dedede;

            margin-bottom: 28px;
        }

        .acs-logo {
            display: block;

            width: 205px;
            height: auto;

            object-fit: contain;
        }


        /* =====================================
           FORM GROUP
        ===================================== */

        .form-group {
            margin-bottom: 22px;
        }


        /* =====================================
           LABEL + CHOOSE USER
        ===================================== */

        .field-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .field-header label {
            color: #171717;

            font-size: 19px;

            font-weight: 400;
        }

        .choose-user {
            color: #6515d5;

            font-size: 16px;

            text-decoration: none;

            cursor: pointer;
        }

        .choose-user:hover {
            text-decoration: underline;
        }


        /* =====================================
           INPUTS
        ===================================== */

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 16px;

            border: 1px solid #d9d9d9;

            border-radius: 8px;

            background: #ffffff;

            color: #333333;

            font-size: 18px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        .form-group input:focus {
            border-color: #a064ed;

            box-shadow:
                0 0 0 2px rgba(160, 100, 237, 0.12);
        }


        /* =====================================
           BOUTON LOG IN
        ===================================== */

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 16px;

            border: none;

            border-radius: 8px;

            background: #a064ed;

            color: #ffffff;

            font-size: 19px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .login-button:hover {
            background: #9253df;
        }

        .login-button:active {
            transform: scale(0.99);
        }


        /* =====================================
           SEPARATEUR
        ===================================== */

        .separator {
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #777777;

            font-size: 16px;
        }


        /* =====================================
           MICROSOFT AZURE
        ===================================== */

        .azure-button {
            width: 100%;

            height: 55px;

            border: 1px solid #d9d9d9;

            border-radius: 8px;

            background: #ffffff;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            color: #202020;

            font-size: 18px;

            cursor: pointer;

            transition:
                background 0.2s ease;
        }

        .azure-button:hover {
            background: #fafafa;
        }

        .azure-icon {
            color: #a064ed;

            font-size: 22px;

            font-weight: bold;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 500px) {

            .page {
                padding: 10px;
            }

            .login-box {
                width: 100%;

                padding: 15px 18px 18px;
            }

            .logo {
                height: 155px;

                margin-bottom: 25px;
            }

            .acs-logo {
                width: 180px;
            }

            .field-header label {
                font-size: 18px;
            }

            .choose-user {
                font-size: 14px;
            }

        }

    </style>
</head>


<body>

    <div class="page">

        <div class="login-box">


            <!-- =================================
                 LOGO ACS
            ================================== -->

            <div class="logo">

                <img
                    src="./acsc.png"
                    alt="Atlas Cloud Services"
                    class="acs-logo"
                >

            </div>


            <!-- =================================
                 FORMULAIRE
            ================================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <div class="field-header">

                        <label for="email">
                            Email
                        </label>

                        <a
                            href="#"
                            class="choose-user"
                            onclick="return false;"
                        >
                            Choose a user
                        </a>

                    </div>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="field-header">

                        <label for="password">
                            Password
                        </label>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Log in
                </button>

            </form>


            <!-- =================================
                 SEPARATEUR
            ================================== -->

            <div class="separator">
                - or -
            </div>


            <!-- =================================
                 AZURE
            ================================== -->

            <button
                type="button"
                class="azure-button"
                id="azureButton"
            >

                <span class="azure-icon">
                    ↪
                </span>

                <span>
                    Microsoft Azure
                </span>

            </button>


        </div>

    </div>


    <script>

        /*
         * Simulation de sensibilisation.
         *
         * Aucune donnée saisie n'est envoyée
         * ou enregistrée.
         */

        const loginForm =
            document.getElementById("loginForm");

        const azureButton =
            document.getElementById("azureButton");


        /*
         * Bouton Log in
         */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                window.location.href =
                    "sensibilisation.html";

            }
        );


        /*
         * Bouton Microsoft Azure
         */

        azureButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "sensibilisation.html";

            }
        );

    </script>

</body>
</html>
