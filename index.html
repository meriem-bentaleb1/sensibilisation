<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas Cloud Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background-image:
                url("./datacentre.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }


        /* =====================================
           PAGE
        ===================================== */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =====================================
           PANNEAU BLANC
        ===================================== */

        .login-box {
            width: 400px;

            background: rgba(255, 255, 255, 0.98);

            border-radius: 8px;

            padding: 20px 20px 22px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.16);
        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {
            height: 145px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #dedede;

            margin-bottom: 30px;
        }

        /*
         * Logo temporaire en texte.
         *
         * Si tu as le vrai logo ACS en PNG/SVG,
         * il pourra être remplacé ici.
         */

        .logo-text {
            color: #3446a5;

            font-size: 31px;

            font-weight: 700;

            line-height: 0.92;

            letter-spacing: -1.2px;

            text-align: left;
        }

        .logo-text span {
            display: block;
        }


        /* =====================================
           CHAMPS
        ===================================== */

        .form-group {
            margin-bottom: 23px;
        }

        .field-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .field-header label {
            color: #171717;

            font-size: 19px;

            font-weight: 400;
        }

        .choose-user {
            color: #6515d5;

            font-size: 16px;

            text-decoration: none;

            cursor: pointer;
        }

        .choose-user:hover {
            text-decoration: underline;
        }


        /* =====================================
           INPUTS
        ===================================== */

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 16px;

            border: 1px solid #d9d9d9;

            border-radius: 8px;

            background: #ffffff;

            color: #333333;

            font-size: 18px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        .form-group input:focus {
            border-color: #a064ed;

            box-shadow:
                0 0 0 2px rgba(160, 100, 237, 0.12);
        }


        /* =====================================
           BOUTON LOG IN
        ===================================== */

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 17px;

            border: none;

            border-radius: 8px;

            background: #a064ed;

            color: #ffffff;

            font-size: 19px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .login-button:hover {
            background: #9253df;
        }

        .login-button:active {
            transform: scale(0.99);
        }


        /* =====================================
           SEPARATEUR
        ===================================== */

        .separator {
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #777777;

            font-size: 16px;
        }


        /* =====================================
           MICROSOFT AZURE
        ===================================== */

        .azure-button {
            width: 100%;

            height: 55px;

            border: 1px solid #d9d9d9;

            border-radius: 8px;

            background: #ffffff;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            color: #202020;

            font-size: 18px;

            cursor: pointer;

            transition:
                background 0.2s ease;
        }

        .azure-button:hover {
            background: #fafafa;
        }

        .azure-icon {
            color: #a064ed;

            font-size: 22px;

            font-weight: bold;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 500px) {

            .page {
                padding: 12px;
            }

            .login-box {
                width: 100%;

                padding: 18px 18px 20px;
            }

            .logo {
                height: 135px;

                margin-bottom: 28px;
            }

            .logo-text {
                font-size: 28px;
            }

            .field-header label {
                font-size: 18px;
            }

            .choose-user {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>

    <div class="page">

        <div class="login-box">


            <!-- =================================
                 LOGO
            ================================== -->

            <div class="logo">

                <div class="logo-text">

                    <span>Atlas</span>
                    <span>Cloud</span>
                    <span>Services</span>

                </div>

            </div>


            <!-- =================================
                 FORMULAIRE
            ================================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <div class="field-header">

                        <label for="email">
                            Email
                        </label>

                        <a
                            href="#"
                            class="choose-user"
                            onclick="return false;"
                        >
                            Choose a user
                        </a>

                    </div>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="field-header">

                        <label for="password">
                            Password
                        </label>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Log in
                </button>

            </form>


            <!-- =================================
                 SEPARATEUR
            ================================== -->

            <div class="separator">
                - or -
            </div>


            <!-- =================================
                 AZURE — BOUTON DE SIMULATION
            ================================== -->

            <button
                type="button"
                class="azure-button"
                id="azureButton"
            >

                <span class="azure-icon">
                    ↪
                </span>

                <span>
                    Microsoft Azure
                </span>

            </button>


        </div>

    </div>


    <script>

        /*
         * =========================================
         * SIMULATION DE SENSIBILISATION
         * =========================================
         *
         * Aucune donnée saisie n'est envoyée
         * à un serveur et aucune donnée n'est
         * enregistrée.
         */


        const loginForm =
            document.getElementById("loginForm");


        const azureButton =
            document.getElementById("azureButton");


        /*
         * Bouton Log in
         */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                window.location.href =
                    "sensibilisation.html";

            }
        );


        /*
         * Bouton Microsoft Azure
         *
         * Dans cette simulation, il ne lance
         * aucune authentification réelle.
         */

        azureButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "sensibilisation.html";

            }
        );

    </script>

</body>
</html>
