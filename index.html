<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion - Atlas Cloud Services</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --violet: #a56cf2;
    --violet-hover: #9358e6;
    --violet-ring: rgba(165, 108, 242, .35);
    --navy: #2b1d6e;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #d9dce3;
    --link: #4a1fb8;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
  }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI",
                 Roboto, Arial, sans-serif;

    color: var(--text);

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    /*
      IMPORTANT :
      datacentre.jpg doit être dans le même dossier
      que index.html.
    */

    background:
      linear-gradient(
        rgba(20, 50, 100, 0.20),
        rgba(20, 50, 100, 0.20)
      ),
      url("./datacentre.jpg") center center / cover no-repeat fixed;

    background-color: #6fa8e8;
  }

  .card {
    width: 100%;
    max-width: 450px;

    min-height: 857px;

    background: #ffffff;

    border-radius: 8px;

    padding: 24px;

    box-shadow:
      0 10px 40px rgba(0, 0, 0, .18);
  }

  @media (max-height: 900px) {
    .card {
      min-height: 0;
      padding-bottom: 60px;
    }
  }

  .brand {
    display: flex;
    justify-content: center;

    padding-bottom: 20px;

    border-bottom: 1px solid #ececf1;
  }

  .brand svg {
    width: 240px;
    height: auto;
    display: block;
  }

  form {
    margin-top: 72px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;

    margin-bottom: 8px;
  }

  label {
    font-size: 20px;
    font-weight: 500;
  }

  .choose {
    color: var(--link);
    font-size: 17px;
    text-decoration: none;
  }

  .choose:hover {
    text-decoration: underline;
  }

  .field {
    margin-bottom: 22px;
  }

  input {
    width: 100%;
    height: 56px;

    padding: 0 18px;

    font: inherit;
    font-size: 20px;

    color: var(--text);
    background: #fff;

    border: 1px solid var(--border);
    border-radius: 8px;

    outline: none;

    transition:
      border-color .15s,
      box-shadow .15s;
  }

  input::placeholder {
    color: #9ca3af;
  }

  input:focus {
    border-color: var(--violet);

    box-shadow:
      0 0 0 3px var(--violet-ring);
  }

  .btn {
    width: 100%;
    height: 56px;

    margin-top: 26px;

    font: inherit;
    font-size: 22px;
    font-weight: 500;

    color: #fff;

    background: var(--violet);

    border: 0;
    border-radius: 8px;

    cursor: pointer;

    transition: background .15s;
  }

  .btn:hover {
    background: var(--violet-hover);
  }

  .btn:focus-visible {
    outline: 3px solid var(--violet-ring);
    outline-offset: 2px;
  }

  .or {
    text-align: center;

    color: var(--muted);

    font-size: 18px;

    margin: 18px 0;
  }

  .sso {
    width: 100%;
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    font: inherit;
    font-size: 22px;

    color: var(--text);

    background: #fff;

    border: 1px solid var(--border);
    border-radius: 8px;

    cursor: pointer;

    transition: background .15s;
  }

  .sso:hover {
    background: #f7f7fa;
  }

  .sso svg {
    width: 22px;
    height: 22px;

    color: var(--violet);
  }

  .training-message {
    display: none;

    margin-top: 24px;

    padding: 16px;

    border-radius: 8px;

    background: #f5f1ff;

    border: 1px solid #ddd0ff;

    color: var(--navy);

    font-size: 15px;
    line-height: 1.5;
  }

  .training-message.show {
    display: block;
  }

  .training-message strong {
    display: block;

    margin-bottom: 6px;

    font-size: 17px;
  }

  .security-note {
    margin-top: 24px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
  }
</style>

</head>

<body>

<main class="card">

  <div class="brand">

  </div>

  <form id="login-form" novalidate>

```
<div class="field">

  <div class="row">
    <label for="email">Email</label>

    <a href="#" class="choose" id="choose-user">
      Choose a user
    </a>
  </div>

  <input
    id="email"
    name="email"
    type="email"
    placeholder="Email"
    autocomplete="off"
    autofocus
    required>

</div>


<div class="field">

  <div class="row">
    <label for="password">Password</label>
  </div>

  <input
    id="password"
    name="password"
    type="password"
    placeholder="Password"
    autocomplete="off"
    required>

</div>


<button
  type="submit"
  class="btn">
  Log in
</button>


<div class="or">
  - or -
</div>


<button
  type="button"
  class="sso"
  id="azure">

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">

    <path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/>

    <path d="M4 12h11"/>

    <path
      d="M11 8l4 4-4 4"
      fill="currentColor"/>

  </svg>

  Microsoft Azure

</button>


<div
  id="training-message"
  class="training-message">

  <strong>
    ⚠️ Ceci était une simulation de sensibilisation.
  </strong>

  Vous avez été redirigé vers une page de simulation.
  Dans une situation réelle, vérifiez toujours l'adresse
  du site avant de saisir vos identifiants.

</div>
```

  </form>

  <div class="security-note">
    Atlas Cloud Services — Security Awareness
  </div>

</main>

<script>

  const form =
    document.getElementById("login-form");

  const message =
    document.getElementById("training-message");


  form.addEventListener("submit", function(event) {

    event.preventDefault();

    /*
      Simulation uniquement.
      Aucun identifiant n'est envoyé ou enregistré.
    */

    message.classList.add("show");

    document.getElementById("email").value = "";
    document.getElementById("password").value = "";

  });


  document
    .getElementById("azure")
    .addEventListener("click", function() {

      message.classList.add("show");

    });


  document
    .getElementById("choose-user")
    .addEventListener("click", function(event) {

      event.preventDefault();

      message.classList.add("show");

    });

</script>

</body>
</html>
